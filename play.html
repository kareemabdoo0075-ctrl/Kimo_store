<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل اللعبة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 10px 20px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c2c2c; }
        .back-btn { color: #a8c7fa; text-decoration: none; font-weight: bold; border: 1px solid #a8c7fa; padding: 5px 12px; border-radius: 8px; font-size: 14px; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn">⬅ عودة</a>
        <h3 id="game-title">جاري تحميل اللعبة...</h3>
    </header>
    <iframe id="game-iframe" src="" allow="autoplay; keyboard; fullscreen"></iframe>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('url');
        const gameTitle = urlParams.get('title');
        if (gameUrl) document.getElementById('game-iframe').src = gameUrl;
        if (gameTitle) document.getElementById('game-title').innerText = gameTitle;
    </script>
</body>
</html>
